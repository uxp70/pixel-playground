<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reaction Test — Pixel Playground</title>
  <meta name="description" content="How fast are your reflexes? Five rounds, one green screen. Find your average reaction time." />
  <meta name="theme-color" content="#070912" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="game-page">
  <div class="orbs" aria-hidden="true"><span></span><span></span></div>
  <a class="skip" href="#main">Skip to game</a>

  <header class="game-head">
    <a class="back" href="../index.html"><span aria-hidden="true">←</span> All games</a>
    <span class="game-title">Reaction Test</span>
    <span class="chip">Best <b id="best">—</b></span>
    <button class="icon-btn" type="button" data-mute aria-label="Mute sound">🔊</button>
  </header>

  <main id="main" class="game-main">
    <div class="hud">
      <span class="chip">Round <b id="round">0 / 5</b></span>
      <span class="chip">Last <b id="last">—</b></span>
      <span class="chip">Average <b id="average">—</b></span>
    </div>

    <button class="reaction-pad" id="pad" type="button" data-state="idle">
      <span class="pad-title" id="padTitle">Tap to start</span>
      <span class="pad-sub" id="padSub">Five rounds · wait for green</span>
    </button>

    <div class="rounds" id="rounds" aria-label="Round results"></div>

    <div class="game-tools">
      <button class="btn small ghost" type="button" id="reset">Reset run</button>
    </div>

    <p class="hint">
      The pad turns green at a random moment — tap as soon as it does. Tapping early
      restarts that round.
    </p>
  </main>

  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/reaction.js"></script>
</body>
</html>
