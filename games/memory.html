<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory Match — Pixel Playground</title>
  <meta name="description" content="Flip the cards and find all eight pairs in as few moves as possible." />
  <meta name="theme-color" content="#070912" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="game-page">
  <div class="orbs" aria-hidden="true"><span></span><span></span></div>
  <a class="skip" href="#main">Skip to game</a>

  <header class="game-head">
    <a class="back" href="../index.html"><span aria-hidden="true">←</span> All games</a>
    <span class="game-title">Memory Match</span>
    <span class="chip">Best <b id="best">—</b></span>
    <button class="icon-btn" type="button" data-mute aria-label="Mute sound">🔊</button>
  </header>

  <main id="main" class="game-main">
    <div class="hud">
      <span class="chip">Moves <b id="moves">0</b></span>
      <span class="chip">Pairs <b id="pairs">0 / 8</b></span>
      <span class="chip">Time <b id="time">0:00</b></span>
    </div>

    <div class="stage" style="max-width:520px; overflow:visible; background:none; border:0; box-shadow:none;">
      <div class="memory-board" id="board" role="group" aria-label="Memory cards"></div>
      <div class="overlay" id="overlay"></div>
    </div>

    <div class="game-tools">
      <button class="btn small ghost" type="button" id="newGame">Shuffle &amp; restart</button>
    </div>

    <p class="hint">Flip two cards at a time. Matched pairs stay face up — fewer moves is better.</p>
  </main>

  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/memory.js"></script>
</body>
</html>
