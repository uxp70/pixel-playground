<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Play — Pixel Playground</title>
  <meta name="description" content="One page, 176 playable challenges. Tap to play any cabinet in the Pixel Playground arcade." />
  <meta name="theme-color" content="#070912" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/refresh.css" />
</head>
<body class="game-page">
  <div class="orbs" aria-hidden="true"><span></span><span></span></div>
  <a class="skip" href="#main">Skip to game</a>

  <header class="game-head">
    <a class="back" href="../index.html"><span aria-hidden="true">←</span> All games</a>
    <span class="game-title" id="game-title">Loading…</span>
    <span class="chip">Best <b id="best">0</b></span>
    <button class="icon-btn" type="button" data-mute aria-label="Mute sound">🔊</button>
  </header>

  <main id="main" class="game-main">
    <p class="game-crumb" id="game-crumb"></p>

    <div class="hud">
      <span class="chip"><span class="hud-key" id="hudALabel">Score</span> <b id="hudA">0</b></span>
      <span class="chip"><span class="hud-key" id="hudBLabel">Detail</span> <b id="hudB">—</b></span>
    </div>

    <div class="stage" style="max-width:520px">
      <canvas id="board" width="600" height="600" role="img" aria-label="Game board"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>

    <p class="hint" id="game-hint">Pick a game from the arcade.</p>
    <p class="hint">
      <a href="../leaderboard.html">🏆 Leaderboard</a> ·
      <a href="../account.html">Your account</a> ·
      <a href="../index.html#games">All 176 entries</a>
    </p>
  </main>

  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/games-data.js"></script>
  <script src="../assets/js/atlas-data.js"></script>
  <script src="../assets/js/kit.js"></script>
  <script src="../assets/js/kits/tap.js"></script>
  <script src="../assets/js/kits/dodge.js"></script>
  <script src="../assets/js/kits/catch.js"></script>
  <script src="../assets/js/kits/flash.js"></script>
  <script src="../assets/js/kits/reflex.js"></script>
  <script src="../assets/js/kits/stack.js"></script>
  <script src="../assets/js/kits/quiz.js"></script>
  <script src="../assets/js/kits/snakey.js"></script>
  <script src="../assets/js/kits/breaker.js"></script>
  <script src="../assets/js/kits/lanes.js"></script>
  <script src="../assets/js/atlas.js"></script>
  <script src="../assets/js/atlas/01-timing.js"></script>
  <script src="../assets/js/atlas/02-aim.js"></script>
  <script src="../assets/js/atlas/03-puzzles.js"></script>
  <script src="../assets/js/atlas/04-brain.js"></script>
  <script src="../assets/js/atlas/05-action.js"></script>
</body>
</html>
