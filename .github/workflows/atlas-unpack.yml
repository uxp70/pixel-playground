name: Unpack Atlas release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack and commit
        run: |
          set -e
          test -f atlas-release-00.b64
          cat atlas-release-*.b64 | tar xJ
          rm atlas-release-*.b64
          rm .github/workflows/atlas-unpack.yml
          git config user.name "Pixel Playground Release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add 900 Atlas modes and finish the 1,026-game catalogue"
          git push
